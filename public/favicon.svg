<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="50%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
  </defs>
  
  <!-- Laurel / Leaf branches around left and right -->
  <!-- Left laurel -->
  <g fill="#DC2626" opacity="0.9">
    <path d="M 24 64 C 18 60 16 52 18 46 C 22 50 25 54 26 58 Z" />
    <path d="M 21 52 C 16 46 15 38 18 32 C 22 36 24 41 24 46 Z" />
    <path d="M 22 38 C 18 32 20 24 24 20 C 27 24 28 30 27 35 Z" />
    <path d="M 27 26 C 25 20 28 14 34 12 C 34 17 33 22 31 25 Z" />
  </g>
  <!-- Right laurel -->
  <g fill="#DC2626" opacity="0.9">
    <path d="M 76 64 C 82 60 84 52 82 46 C 78 50 75 54 74 58 Z" />
    <path d="M 79 52 C 84 46 85 38 82 32 C 78 36 76 41 76 46 Z" />
    <path d="M 78 38 C 82 32 80 24 76 20 C 73 24 72 30 73 35 Z" />
    <path d="M 73 26 C 75 20 72 14 66 12 C 66 17 67 22 69 25 Z" />
  </g>

  <!-- Golden/Orange U-like Emblem -->
  <path d="M 30 24 C 30 66 38 78 50 78 C 62 78 70 66 70 24 C 65 26 62 38 62 46 C 62 65 57 70 50 70 C 43 70 38 65 38 46 C 38 38 35 26 30 24 Z" fill="url(#goldGrad)" />
  
  <!-- Outer Crest base arc -->
  <path d="M 28 72 C 38 85 62 85 72 72 C 67 78 33 78 28 72 Z" fill="#D97706" />

  <!-- Central Circular Sun Element -->
  <circle cx="50" cy="46" r="11" fill="url(#sunGrad)" />

  <!-- Central Red/Orange Vertical Solar Flame Element -->
  <path d="M 50 18 C 45 28 44 36 46 44 C 47 37 49 32 50 28 C 51 32 53 37 54 44 C 56 36 55 28 50 18 Z" fill="url(#flameGrad)" />

  <!-- Radiating sun rays inside emblem -->
  <line x1="50" y1="32" x2="50" y2="28" stroke="#FDE047" stroke-width="2" stroke-linecap="round" />
  <line x1="39" y1="46" x2="35" y2="46" stroke="#FDE047" stroke-width="2" stroke-linecap="round" />
  <line x1="61" y1="46" x2="65" y2="46" stroke="#FDE047" stroke-width="2" stroke-linecap="round" />
  <line x1="42" y1="38" x2="39" y2="35" stroke="#FDE047" stroke-width="1.5" stroke-linecap="round" />
  <line x1="58" y1="38" x2="61" y2="35" stroke="#FDE047" stroke-width="1.5" stroke-linecap="round" />

  <!-- Bottom emblem ribbon highlight -->
  <path d="M 40 82 L 50 86 L 60 82 L 50 84 Z" fill="#DC2626" />
</svg>
